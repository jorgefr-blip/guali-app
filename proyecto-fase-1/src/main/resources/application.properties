spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
# --- Sesion del administrador ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# El navegador no debe reutilizar HTML/CSS/JS viejos
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Compilador (guali-dev.jar) ---
# JDK completo con javac. Por defecto usa el JDK con el que se ejecuta la app (java.home).
# Para fijarlo: descomenta y ajusta, o define la variable de entorno GUALI_JDK_HOME.
#guali.jdk-home=C:/Program Files/Eclipse Adoptium/jdk-25.0.5.8-hotspot