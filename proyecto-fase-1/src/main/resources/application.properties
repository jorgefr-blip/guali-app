spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/guali
spring.datasource.username=guali
spring.datasource.password=nueva_password_segura
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
# --- Sesion del administrador ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# El navegador no debe reutilizar HTML/CSS/JS viejos
spring.web.resources.cache.cachecontrol.no-cache=true

