<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Uso - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .cards { display: flex; justify-content: space-around; margin-top: 30px; flex-wrap: wrap; gap: 20px; }
        .card { background: #2196F3; color: white; padding: 20px; border-radius: 8px; text-align: center; width: 200px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card h3 { margin: 0; font-size: 36px; }
        .card p { margin: 5px 0 0; font-weight: bold; }
        .btn-volver { display: inline-block; margin-top: 30px; background: #4CAF50; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        
        /* Estilos para el formulario de filtro */
        .filtro-form { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; align-items: center; flex-wrap: wrap; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .filtro-form label { font-weight: bold; color: #555; }
        .filtro-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-filtrar { padding: 8px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-limpiar { padding: 8px 20px; background: #9e9e9e; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Estadísticas de Uso</h2>
        
        <!-- Formulario de filtro por fechas -->
        <form th:action="@{/admin/estadisticas}" method="get" class="filtro-form">
            <label>Desde:</label>
            <input type="date" name="desde" th:value="${desde}">
            
            <label>Hasta:</label>
            <input type="date" name="hasta" th:value="${hasta}">
            
            <button type="submit" class="btn-filtrar">Filtrar</button>
            <a href="/admin/estadisticas" class="btn-limpiar">Limpiar</a>
        </form>

        <div class="cards">
            <div class="card" style="background: #4CAF50;">
                <h3 th:text="${totalLecciones}">0</h3>
                <p>Lecciones Creadas</p>
            </div>
            
            <div class="card" style="background: #FF9800;">
                <h3 th:text="${totalUsuarios}">0</h3>
                <p>Administradores</p>
            </div>
            
            <div class="card" style="background: #f44336;">
                <h3 th:text="${totalIntentos}">0</h3>
                <p>Intentos de Estudio</p>
            </div>
        </div>

        <a href="/admin/panel" class="btn-volver">← Volver al Panel</a>
    </div>

</body>
</html>
