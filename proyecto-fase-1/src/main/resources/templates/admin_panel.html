<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Guali</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        .menu { list-style: none; padding: 0; margin-top: 30px; }
        .menu li { margin: 15px 0; }
        .menu a { text-decoration: none; background: #2196F3; color: white; padding: 12px 20px; border-radius: 5px; display: block; font-weight: bold; }
        .menu a:hover { background: #1976D2; }
        .logout { margin-top: 20px; color: #f44336; background: none; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        .irlecciones { display: inline-block; margin-top: 25px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bienvenido al Panel de Administración</h1>
        <p>Has iniciado sesión como <strong th:text="${nombreAdmin}">admin</strong>.</p>

     <ul class="menu">
    <li><a href="/admin/lecciones">📚 Gestionar Lecciones</a></li>
    
    <li><a href="/admin/usuarios">👥 Gestionar Usuarios Administradores</a></li>
    <li><a href="/admin/estadisticas">📊 Ver Estadísticas de Uso</a></li>
</ul>
        <a href="/lecciones" class="irlecciones">← Ir a las lecciones</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout">Cerrar Sesión</button>
        </form>
    </div>

</body>
</html>
