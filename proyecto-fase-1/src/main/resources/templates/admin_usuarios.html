<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Usuarios - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        .btn-nuevo { display: inline-block; background: #4CAF50; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-eliminar { background-color: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-volver { display: inline-block; margin-top: 20px; background: #2196F3; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        .badge-activo { background: #4CAF50; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
        .badge-inactivo { background: #f44336; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gestión de Usuarios Administradores</h2>
        
        <a href="/admin/usuarios/nuevo" class="btn-nuevo">+ Nuevo Administrador</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.nombre}"></td>
                    <td>
                        <span th:if="${u.activo}" class="badge-activo">Activo</span>
                        <span th:if="${!u.activo}" class="badge-inactivo">Inactivo</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn-eliminar" onclick="return confirm('¿Seguro que quieres eliminar este usuario?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <a href="/admin/panel" class="btn-volver">← Volver al Panel</a>
    </div>
</body>
</html>
